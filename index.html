<style>
  :root{
    --ink:#044D66;
    --ink-2:#007AC6;
    --paper:#F7FBFC;
    --paper-2:#D9F0F9;
    --line:#BFDCE8;
    --amber:#FAA41A;
    --amber-dk:#D98B12;
    --teal:#179AD7;
    --red:#C1443B;
    --green:#00B188;
    --ink-soft:#36697D;
    --text:#0F2B36;
    font-family:'Work Sans',Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  #mri-app{color:var(--text);background:var(--paper);min-height:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  #mri-app h1,#mri-app h2,#mri-app h3{font-family:'Work Sans',Arial,system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0;}
  #mri-app .mono{font-variant-numeric:tabular-nums;font-family:'Work Sans',monospace;font-weight:600;}
  #mri-app .topbar{background:var(--ink);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  #mri-app .topbar .brand{display:flex;align-items:center;gap:12px;}
  #mri-app .topbar .brand .dot{width:10px;height:10px;border-radius:2px;background:#BBD437;display:inline-block;transform:rotate(45deg);}
  #mri-app .topbar .mriword{background:#fff;border-radius:7px;padding:6px 12px;display:inline-flex;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  #mri-app .topbar .mriword img{height:28px;display:block;}
  #mri-app .topbar .brandtext{display:flex;flex-direction:column;line-height:1.15;}
  #mri-app .topbar h1{font-size:19px;color:#fff;}
  #mri-app .topbar .sub{color:#B9C3DA;font-size:12.5px;}
  #mri-app nav{display:flex;gap:2px;background:var(--ink-2);padding:0 14px;flex-wrap:wrap;}
  #mri-app nav button{background:transparent;border:none;color:#C9D2E6;padding:11px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;font-family:inherit;letter-spacing:.02em;}
  #mri-app nav button:hover{color:#fff;}
  #mri-app nav button.active{color:#fff;border-bottom-color:var(--amber);}
  #mri-app .body{padding:20px 22px 30px;}
  #mri-app .panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px;}
  #mri-app .panel > h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:12px;}
  #mri-app .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #mri-app .btn{background:var(--ink);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  #mri-app .btn:hover{background:var(--ink-2);}
  #mri-app .btn.amber{background:var(--amber-dk);}
  #mri-app .btn.amber:hover{background:#a3721f;}
  #mri-app .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  #mri-app .btn.ghost:hover{background:var(--paper-2);}
  #mri-app .btn.sm{padding:5px 9px;font-size:11.5px;}
  #mri-app input[type=text],#mri-app input[type=number],#mri-app select,#mri-app textarea{
    border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:13px;font-family:inherit;background:#fff;color:var(--text);
  }
  #mri-app table{border-collapse:collapse;width:100%;font-size:12.5px;}
  #mri-app th{background:var(--paper-2);text-align:left;padding:7px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);position:sticky;top:0;white-space:nowrap;}
  #mri-app td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;}
  #mri-app .scrollx{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;}
  #mri-app .scrolly{max-height:520px;overflow-y:auto;}
  #mri-app .badge{display:inline-block;padding:2px 7px;border-radius:100px;font-size:11px;font-weight:700;font-family:'Work Sans',monospace;font-weight:700;}
  #mri-app .badge.ok{background:#E4F0E8;color:var(--green);}
  #mri-app .badge.short{background:#FBE7E3;color:var(--red);}
  #mri-app .badge.over{background:#FCEFD9;color:var(--amber-dk);}
  #mri-app .pill{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11.5px;background:var(--paper-2);color:var(--ink-soft);font-weight:600;}
  #mri-app .flap{background:var(--ink);color:#fff;border-radius:4px;padding:4px 8px;font-family:'Work Sans',monospace;font-weight:700;font-size:12px;letter-spacing:.03em;}
  #mri-app .muted{color:var(--ink-soft);font-size:12.5px;}
  #mri-app .grid-cell-select{width:100%;font-size:11.5px;padding:3px 4px;}
  #mri-app .day-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  #mri-app .day-tabs button{font-family:inherit;}
  #mri-app .day-tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  #mri-app .note{background:#FCF6E8;border:1px solid #EBD9A8;border-radius:6px;padding:9px 12px;font-size:12.5px;color:#6B531C;margin-bottom:12px;}
  #mri-app .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  #mri-app label.small{font-size:11.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:3px;}
  #mri-app .person-card{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;}
  #mri-app .save-flag{font-size:11.5px;color:var(--ink-soft);}
  #mri-app ::-webkit-scrollbar{height:9px;width:9px;}
  #mri-app ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  #mri-app .fill-overlay{position:fixed;inset:0;background:rgba(18,33,59,0.55);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;}
  #mri-app .fill-card{background:#fff;border-radius:10px;padding:18px 20px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  #mri-app .fill-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px;}
  #mri-app .fill-row:last-child{border-bottom:none;}
  #mri-app .badge-btn{border:none;cursor:pointer;font-family:'Work Sans',monospace;font-weight:700;}
  #mri-app .badge-btn:hover{outline:2px solid var(--amber);}
  #mri-app .admin-bar{background:#FCEFD9;color:#6B531C;padding:6px 22px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:12px;border-bottom:1px solid #EBD9A8;}
</style>

<script>
(function(){

// ---------- utilities ----------
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Native prompt()/alert()/confirm() don't reliably work inside Claude's
// artifact sandbox, so every dialog in this app uses this in-page modal
// instead. All three helpers are callback-based since a real modal can't
// block execution the way the native dialogs do.
function closeCustomModal(){
  const el = document.getElementById('mri-custom-modal');
  if(el) el.remove();
}
function showCustomModal(innerHtml, onMount){
  closeCustomModal();
  const overlay = document.createElement('div');
  overlay.id = 'mri-custom-modal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `<div style="background:#fff;border-radius:10px;padding:22px 24px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3);font-family:inherit">${innerHtml}</div>`;
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeCustomModal(); });
  document.body.appendChild(overlay);
  if(onMount) onMount(overlay);
}
function customAlert(message, title){
  showCustomModal(`
    <div style="font-weight:700;margin-bottom:8px">${esc(title||'Notice')}</div>
    <div style="margin-bottom:16px;white-space:pre-wrap">${esc(message)}</div>
    <div style="text-align:right"><button class="btn sm amber" id="mri-modal-ok">OK</button></div>
  `, overlay=>{
    overlay.querySelector('#mri-modal-ok').focus();
    overlay.querySelector('#mri-modal-ok').onclick = closeCustomModal;
  });
}
function customConfirm(message, onResult, title){
  showCustomModal(`
    <div style="font-weight:700;margin-bottom:8px">${esc(title||'Confirm')}</div>
    <div style="margin-bottom:16px;white-space:pre-wrap">${esc(message)}</div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn sm ghost" id="mri-modal-cancel">Cancel</button>
      <button class="btn sm amber" id="mri-modal-ok">Continue</button>
    </div>
  `, overlay=>{
    overlay.querySelector('#mri-modal-ok').focus();
    overlay.querySelector('#mri-modal-ok').onclick = ()=>{ closeCustomModal(); onResult(true); };
    overlay.querySelector('#mri-modal-cancel').onclick = ()=>{ closeCustomModal(); onResult(false); };
  });

  showCustomModal(`

    <div id="mri-login-error" style="color:#B5493A;font-size:12.5px;margin-bottom:8px;display:none"></div>
    <div style="text-align:right;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn sm ghost" id="mri-modal-cancel">Cancel</button>
      <button class="btn sm amber" id="mri-modal-ok">Sign in</button>
    </div>
  `, overlay=>{
    const emailEl = overlay.querySelector('#mri-login-email');
    const passEl = overlay.querySelector('#mri-login-password');
    const errEl = overlay.querySelector('#mri-login-error');
    emailEl.focus();
    const submit = async ()=>{
      const email = emailEl.value.trim();
      const password = passEl.value;
      if(!email || !password) return;
      if(!SUPABASE_CONFIGURED){
        errEl.textContent = 'Not connected to a database yet.';
        errEl.style.display = 'block';
        return;
      }
      const okBtn = overlay.querySelector('#mri-modal-ok');
      okBtn.disabled = true;
      okBtn.textContent = 'Signing in…';
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if(error){
        okBtn.disabled = false;
        okBtn.textContent = 'Sign in';
        errEl.textContent = 'Incorrect email or password.';
        errEl.style.display = 'block';
        return;
      }
      isAdmin = true;
      closeCustomModal();
      render();
    };
    overlay.querySelector('#mri-modal-ok').onclick = submit;
    overlay.querySelector('#mri-modal-cancel').onclick = closeCustomModal;
    [emailEl, passEl].forEach(el=>el.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); if(e.key==='Escape') closeCustomModal(); }));
  });
}
function firstName(p){ return (p.name||'').trim().split(/\s+/)[0].toLowerCase(); }
function byFirstName(a,b){ return firstName(a).localeCompare(firstName(b)) || a.name.localeCompare(b.name); }
// Parses "H:MM" or "HH:MM" (24h) into minutes-since-midnight for sorting.
// Never compare start times as raw strings — "9:00" sorts after "16:00"
// alphabetically, which is wrong. Always use this instead.
function startMinutes(t){
  if(!t) return 0;
  const parts = String(t).split(':');
  const h = parseInt(parts[0],10);
  const m = parseInt(parts[1],10);
  return (isNaN(h)?0:h)*60 + (isNaN(m)?0:m);
}
function sortSlotsByStart(slots){ slots.sort((a,b)=> startMinutes(a.start) - startMinutes(b.start)); }

  { version: 36, apply(st){
    // Oct 2026: reconciliation / repair pass.
    //
    // A storage-load bug (now fixed, see the STORAGE_AVAILABLE branch of
    // loadState()) could stamp a board's saved data as "already migrated"
    // to a given SEED_VERSION without the matching patch(es) ever actually
    // running against it — e.g. if window.storage briefly returned no
    // value on a load, the board fell back to a raw, un-patched
    // defaultState() but had its seedVersion field stamped to the CURRENT
    // version anyway, permanently short-circuiting every patch (including,
    // previously, this one) on every future load. That left at least one
    // board stuck on a stale roster — missing not just the v35 roster
    // update but every roster change made in any earlier version — and no
    // amount of republishing the file could fix it, because the bug lived
    // in the saved data, not the code.
    //
    // Rather than re-deriving "the correct roster" by hand (risking
    // resurrecting people some *other*, unrelated patch legitimately
    // removed), this reconstructs the exact state a healthy load would
    // have produced by re-running the entire patch chain through v35 on a
    // fresh seed, then reconciles st against THAT. It only adds people
    // who are completely missing and never touches or removes anyone
    // already present, so any edits made since v35 (station assignments,
    // etc.) are left alone. Re-running this against an already-correct
    // board is a no-op.
    const rawSeedIds = new Set(defaultState().staff.map(p=>p.id));
    const reference = defaultState();
    SEED_PATCHES.filter(p=>p.version < 36).sort((a,b)=>a.version-b.version)
      .forEach(p=>{ try{ p.apply(reference); }catch(e){} });
    const referenceIds = new Set(reference.staff.map(p=>p.id));

    // Drop anyone who came from the original seed (a 'p0xx'-style id) and
    // was legitimately removed by some earlier patch, in case they
    // survived a partial migration. Never touches ids outside the raw
    // seed's id space (those are people added later through the admin UI
    // with a uid('st')-style id, which this repair must leave alone).
    st.staff = st.staff.filter(p=>!(rawSeedIds.has(p.id) && !referenceIds.has(p.id)));

    // Add back anyone who should be present per the reference chain but is
    // missing from the current state.
    const presentIds = new Set(st.staff.map(p=>p.id));
    reference.staff.forEach(p=>{
      if(!presentIds.has(p.id)) st.staff.push(Object.assign({}, p));
    });
  }},

function applySeedPatches(st){
  const have = st.seedVersion || 0;

}

// Avoids clobbering someone's in-progress edit: a realtime update from
// another tab/person is applied immediately UNLESS the focused element
// looks like an active edit (a text input/select/textarea has focus) —
// in that case we wait until they blur out of it before re-rendering.
let pendingRemoteState = null;
function applyRemoteStateIfSafe(){
  if(pendingRemoteState === null) return;
  const active = document.activeElement;
  const isEditing = active && /^(INPUT|SELECT|TEXTAREA)$/.test(active.tagName);
  if(isEditing) return; // try again on the next remote update or on blur
  state = pendingRemoteState;
  pendingRemoteState = null;
  render();
}
document.addEventListener('blur', ()=>setTimeout(applyRemoteStateIfSafe, 0), true);

function initRealtime(){
  supabase.channel('board_state_changes')
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'board_state'}, payload=>{
      if(!payload.new || !payload.new.data) return;
      pendingRemoteState = payload.new.data;
      applyRemoteStateIfSafe();
    })
    .subscribe();
}

async function refreshAdminStatus(){
  const { data: { session } } = await supabase.auth.getSession();
  isAdmin = !!session;
}

async function loadState(){
  if(!SUPABASE_CONFIGURED){
    state = defaultState();
    applySeedPatches(state);
    showConfigBanner();
    render();
    return;
  }
  const { data, error } = await supabase.from('board_state').select('data').eq('id', 1).single();
  if(error || !data){
    console.error('Ascend Staffing Board: failed to load from database', error);
    state = defaultState();
  } else {
    state = data.data;
  }
  const before = JSON.stringify(state);
  applySeedPatches(state);
  if(JSON.stringify(state) !== before) persist();

  await refreshAdminStatus();
  supabase.auth.onAuthStateChange((_event, _session)=>{ refreshAdminStatus().then(render); });
  initRealtime();
  render();
}

let saveTimer=null;
let saveAttemptToken=0;
async function attemptSave(retriesLeft){
  if(!SUPABASE_CONFIGURED){
    showConfigBanner();
    saveStatus.innerHTML = 'not connected — use Download backup to save your work';
    return;
  }
  const myToken = ++saveAttemptToken;
  try{
    const { data: { session } } = await supabase.auth.getSession();
    const { error } = await supabase.from('board_state')
      .update({ data: state, updated_by: session ? session.user.id : null })
      .eq('id', 1);
    if(error) throw error;
    if(myToken!==saveAttemptToken) return; // a newer save started; let it own the status
    saveStatus.innerHTML = 'saved · shared with your planning team';
  }catch(e){
    console.error('Ascend Staffing Board: save failed', e);
    if(retriesLeft > 0){
      await new Promise(r=>setTimeout(r, 800));
      if(myToken!==saveAttemptToken) return;
      return attemptSave(retriesLeft-1);
    }
    if(myToken!==saveAttemptToken) return;
    saveStatus.innerHTML = 'save failed — changes kept in this session only <button id="retry-save-btn" style="margin-left:6px;padding:2px 8px;border-radius:5px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:11px">Retry save</button> <button id="backup-save-btn" style="margin-left:4px;padding:2px 8px;border-radius:5px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:11px">Download backup</button>';
    const btn = document.getElementById('retry-save-btn');
    if(btn) btn.onclick = ()=>persist();
    const backupBtn = document.getElementById('backup-save-btn');
    if(backupBtn) backupBtn.onclick = ()=>downloadBackup();
  }
}
function persist(){
  if(!SUPABASE_CONFIGURED){ attemptSave(0); return; }
  saveStatus.textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ attemptSave(2); }, 350);
}

function update(fn){ fn(state); persist(); render(); }
// For pure navigation (switching tabs/days/selected person) — this is
// per-viewer UI state, not shared data, so it should never trigger a save
// or get written into the shared board that other people see.
function updateLocal(fn){ fn(state); render(); }

function downloadBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ascend_staffing_backup_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function restoreFromBackupFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.staff) || !Array.isArray(parsed.days)){
        customAlert("That file doesn't look like a valid Ascend Staffing Board backup.");
        return;
      }
      customConfirm('This will replace everything currently shown with the backup file. Continue?', (ok)=>{
        if(!ok) return;
        state = parsed;
        persist();
        render();
      });
    }catch(e){
      customAlert('Could not read that file as a backup: '+e.message);
    }
  };
  reader.readAsText(file);
}

// ---------- derived helpers ----------
function getDay(dayId){ return state.days.find(d=>d.id===dayId); }
function getStation(id){ return state.stations.find(s=>s.id===id); }
// Same color language as the Excel export: pods green, sessions orange,
// Support Hub purple, Services Desk blue. Everything else stays uncolored.
const CATEGORY_COLORS = { pod:'#C6E0B4', session:'#FFD966', supportHub:'#D9D2E9', servicesDesk:'#BDD7EE', scanning:'#F4B6C2', wayfinding:'#F8CBAD', partner:'#B2DFDB' };
function getCategoryColor(station){
  if(!station) return null;
  if(station.type==='pod') return CATEGORY_COLORS.pod;
  if(station.type==='session') return CATEGORY_COLORS.session;
  if(station.name==='Support Hub') return CATEGORY_COLORS.supportHub;
  if(station.name==='Services Desk') return CATEGORY_COLORS.servicesDesk;
  return null;
}
function getStaff(id){ return state.staff.find(s=>s.id===id); }

function stationsActiveOnDay(dayId){
  return state.stations.filter(s=>s.activeDayIds.includes(dayId));
}

// Compute a person's assignment for a given day/slot, respecting manual overrides.
function computeAssignment(staffId, dayId, slotId){
  const key = staffId+'|'+dayId+'|'+slotId;
  if(state.overrides[key] !== undefined) return state.overrides[key]; // {type, stationId?, label?}
  const day = getDay(dayId);
  const slot = day.slots.find(s=>s.id===slotId);
  if(slot.type==='allstaff') return {type:'allstaff', label:slot.label};
  if(slot.type==='break') return {type:'break'};
  const person = getStaff(staffId);
  const station = person ? getStation(person.homeStationId) : null;
  if(station && station.activeDayIds.includes(dayId)) return {type:'station', stationId:station.id};
  return {type:'free'};
}

function setOverride(staffId, dayId, slotId, value){
  const key = staffId+'|'+dayId+'|'+slotId;
  update(st=>{
    if(value===null) delete st.overrides[key];
    else st.overrides[key] = value;
  });
}

function assignmentLabel(a){
  if(!a) return '—';
  if(a.type==='allstaff') return a.label;
  if(a.type==='break') return 'Break';
  if(a.type==='free') return 'Free';
  if(a.type==='station'){
    const s=getStation(a.stationId);
    if(!s) return '—';
    const tag = s.type==='pod' ? 'Pod' : s.type==='session' ? 'Session' : 'Desk';
    return '['+tag+'] '+s.name;
  }
  return '—';
}

// ---------- FIND-A-FILL (replacement suggestions for a gap) ----------
function getCandidates(dayId, slotId, stationId){
  const currentAtStation = state.staff.filter(p=>{
    const a = computeAssignment(p.id, dayId, slotId);
    return a.type==='station' && a.stationId===stationId;
  });
  const deptsHere = new Set(currentAtStation.map(p=>p.dept));
  const candidates = [];
  state.staff.forEach(p=>{
    const a = computeAssignment(p.id, dayId, slotId);
    if(a.type==='station' && a.stationId===stationId) return; // already here
    if(a.type==='allstaff') return; // can't pull from an all-staff event
    const qualified = p.homeStationId===stationId || p.homeStationId2===stationId;
    let status, base;
    if(a.type==='free'){
      status = 'Free at this time';
      base = 0;
    } else if(a.type==='break'){
      status = 'On break at this time';
      base = 1;
    } else if(a.type==='station'){
      const st2 = getStation(a.stationId);
      const countThere = state.staff.filter(p2=>{
        const a2 = computeAssignment(p2.id, dayId, slotId);
        return a2.type==='station' && a2.stationId===a.stationId;
      }).length;
      if(st2 && countThere > st2.required){
        status = 'Currently at '+st2.name+' — that station is over its required count';
        base = 2;
      } else {
        status = 'Currently at '+(st2?st2.name:'another station')+' — pulling them would leave it short';
        base = 3;
      }
    } else { status = 'Unavailable'; base = 4; }
    if(qualified) status += ' · qualified for this station (home station)';
    const deptMatch = deptsHere.has(p.dept);
    const tier = base*10 + (qualified?0:(deptMatch?1:2));
    candidates.push({person:p, status, tier, qualified});
  });
  candidates.sort((a,b)=> a.tier-b.tier || a.person.name.localeCompare(b.person.name));
  return candidates;
}

let fillPanelState = null;
function openFillPanel(dayId, slotId, stationId){ fillPanelState = {dayId, slotId, stationId}; renderFillPanel(); }
function closeFillPanel(){ fillPanelState = null; renderFillPanel(); }

  if(!day || !slot || !station){ closeFillPanel(); return; }
  const count = state.staff.filter(p=>{ const a=computeAssignment(p.id,dayId,slotId); return a.type==='station'&&a.stationId===stationId; }).length;
  const candidates = getCandidates(dayId, slotId, stationId);

      </div>

      <div class="scrolly" style="max-height:360px">
      ${candidates.length ? candidates.map(c=>`
        <div class="fill-row">
          <div><strong>${esc(c.person.name)}</strong>${c.qualified?' <span class="badge ok">qualified</span>':''}<div class="muted">${esc(c.person.dept||'')}${c.person.dept?' · ':''}${esc(c.status.replace(' · qualified for this station (home station)',''))}</div></div>
          <button class="btn sm amber" data-assign="${c.person.id}">Assign here</button>

// ---------- SCANNING DUTY ----------
// Every real session needs one person scanning attendees in, from 15 min
// before the session starts to 15 min after it starts (30 min total).
// Only staff marked canScan are eligible, and they can't already be
// presenting a session (or scanning another one) during that window.
function getScanWindow(station){
  if(!station || station.type!=='session' || !station.scanDayId || !station.scanSlotId) return null;
  const day = getDay(station.scanDayId);
  const slot = day && day.slots.find(s=>s.id===station.scanSlotId);
  if(!slot) return null;
  const center = startMinutes(slot.start);
  return { dayId: station.scanDayId, startMin: center-15, endMin: center+15, sessionStart: slot.start, sessionLabel: slot.label };
}
function fmtMin(total){
  let m = ((total%1440)+1440)%1440;
  let h = Math.floor(m/60), mi = m%60;
  const ap = h<12 ? 'AM' : 'PM';
  let hh = h%12; if(hh===0) hh=12;
  return hh+':'+String(mi).padStart(2,'0')+' '+ap;
}
function isPresentingDuringWindow(personId, dayId, startMin, endMin){
  for(const key in state.overrides){
    const parts = key.split('|');
    if(parts[0]!==personId || parts[1]!==dayId) continue;
    const ov = state.overrides[key];
    if(!ov || ov.type!=='station') continue;
    const st2 = getStation(ov.stationId);
    if(!st2 || st2.type!=='session') continue;
    const day = getDay(dayId);
    const slot = day && day.slots.find(s=>s.id===parts[2]);
    if(!slot) continue;
    const sStart = startMinutes(slot.start), sEnd = startMinutes(slot.end);
    if(sStart < endMin && sEnd > startMin) return true;
  }
  return false;
}
function isScanningDuringWindow(personId, dayId, startMin, endMin, excludeStationId){
  for(const sid in state.scanAssignments){
    if(sid===excludeStationId) continue;
    if(state.scanAssignments[sid]!==personId) continue;
    const st2 = getStation(sid);
    if(!st2) continue;
    const w = getScanWindow(st2);
    if(w && w.dayId===dayId && w.startMin<endMin && w.endMin>startMin) return true;
  }
  return false;
}
// Words pulled from a pod's name + demo'd products, used to guess whether
// someone stationed there would recognize/care about a given session's
// subject matter (e.g. someone on the Multifamily Property Management pod
// probably knows a PMX-titled session better than a random volunteer).
const STOPWORDS = new Set(['the','and','for','with','your','you','from','into','how','what','who','are','was','use','using','101','201','301','ama','table','talks','campfire','workshop','roundtable','hands','on','intro','introduction','deep','dive','best','practices','latest','greatest','new','users','group','users\u2019','management','managing','solutions']);
function stationTopicWords(station){
  if(!station) return [];
  const text = (station.name+' '+(station.demos||'')).toLowerCase();
  const words = text.split(/[^a-z0-9]+/).filter(w=>w.length>=3 && !STOPWORDS.has(w));
  return [...new Set(words)];
}
function isTopicMatch(person, sessionTitle){
  const station = getStation(person.homeStationId) || getStation(person.homeStationId2);
  if(!station) return false;
  const title = sessionTitle.toLowerCase();
  return stationTopicWords(station).some(w=>title.includes(w));
}
function isMarketingScanner(p){ return (p.dept||'')==='Marketing'; }
function hasLeftBeforeWindow(p, w){
  if(w.dayId!=='wed') return false;
  if(p.wedAvailable===false) return true; // gone before Wednesday entirely
  if(p.wedLeaveTime){
    const [h,m] = p.wedLeaveTime.split(':').map(Number);
    if(h*60+m < w.endMin) return true; // departs before the scan window ends
  }
  return false;
}
// ---- WEDNESDAY SCANNERS: edit these lists directly (names exactly as on the roster) ----
// WED_SCAN_ONLY: if you put names here, ONLY these people can scan Wednesday.
//                Leave it empty ([]) to allow everyone on the roster.
// WED_SCAN_NEVER: these people are never offered for Wednesday scanning.
// WED_SCAN_IGNORE_FLIGHT: these people are offered even if the flight/leave data says they've gone.
const WED_SCAN_ONLY = [];
const WED_SCAN_NEVER = ['Cederick Johnson','Sam Skowron','Alyssa Kelley','Alyssa Kelly','Lauren Caiafa'];
const WED_SCAN_IGNORE_FLIGHT = [];
const _wedNames = list => new Set(list.map(n=>n.trim().toLowerCase()));
function getScannerCandidates(station){
  const w = getScanWindow(station);
  if(!w) return [];
  // Wednesday has no wayfinding or registration duties, so anyone still on-site
  // is fair game to scan (not just people flagged canScan). Other days stay
  // limited to the canScan pool.
  const only = _wedNames(WED_SCAN_ONLY), never = _wedNames(WED_SCAN_NEVER);
  const pool = w.dayId==='wed'
    ? state.staff.filter(p=>{ const n = p.name.trim().toLowerCase(); return !never.has(n) && (!only.size || only.has(n)); })
    : state.staff.filter(p=>p.canScan);
  return pool.map(p=>{
    const pw = (w.dayId===PARTNER_SLOT.dayId && state.partnerPlans && state.partnerPlans[p.id] && state.partnerPlans[p.id].sessionId) ? getPartnerSessionWindow() : null;
    const atPartner = !!(pw && pw.startMin<w.endMin && pw.endMin>w.startMin);
    const presenting = atPartner || isPresentingDuringWindow(p.id, w.dayId, w.startMin, w.endMin);
    const scanning = isScanningDuringWindow(p.id, w.dayId, w.startMin, w.endMin, station.id);
    const leftAlready = hasLeftBeforeWindow(p, w) && !(w.dayId==='wed' && _wedNames(WED_SCAN_IGNORE_FLIGHT).has(p.name.trim().toLowerCase()));
    const topicMatch = isTopicMatch(p, station.name);
    const marketing = isMarketingScanner(p);
    return { person:p, eligible: !presenting && !scanning && !leftAlready, presenting, scanning, leftAlready, topicMatch, marketing };
  }).sort((a,b)=>
    (a.eligible===b.eligible?0:a.eligible?-1:1) ||
    // Marketing staff are the primary scanner pool; everyone else is backup.
    (a.marketing===b.marketing?0:a.marketing?-1:1) ||
    (!!a.person.canScan===!!b.person.canScan?0:a.person.canScan?-1:1) ||
    (a.topicMatch===b.topicMatch?0:a.topicMatch?-1:1) ||
    a.person.name.localeCompare(b.person.name)
  );
}
// Used everywhere a person's schedule is shown (Individual Schedules, Staff
// View, PDF, ICS) so scanning duty shows up alongside their normal assignments.
function getPersonScanDuties(personId){
  const out = [];
  for(const sid in state.scanAssignments){
    if(state.scanAssignments[sid]!==personId) continue;
    const st2 = getStation(sid);
    const w = st2 && getScanWindow(st2);
    if(!st2 || !w) continue;
    out.push({ station: st2, window: w });
  }
  out.sort((a,b)=> (a.window.dayId+a.window.startMin) < (b.window.dayId+b.window.startMin) ? -1 : 1);
  return out;
}
function getPersonWayfindingDuties(personId){
  return (state.wayfindingSlots||[]).filter(s=>s.assignedId===personId);
}
// Null if the slot doesn't have both a start and end time set yet (can't
// check conflicts against an undefined window).
function getWayfindingWindow(slot){
  if(!slot || !slot.dayId || !slot.start || !slot.end) return null;
  const startMin = startMinutes(slot.start), endMin = startMinutes(slot.end);
  if(endMin<=startMin) return null; // malformed (e.g. end typed before start)
  return { dayId: slot.dayId, startMin, endMin };
}
function isWayfindingDuringWindow(personId, dayId, startMin, endMin, excludeSlotId){
  for(const s of (state.wayfindingSlots||[])){
    if(s.id===excludeSlotId) continue;
    if(s.assignedId!==personId) continue;
    const w = getWayfindingWindow(s);
    if(w && w.dayId===dayId && w.startMin<endMin && w.endMin>startMin) return true;
  }
  return false;
}
// Eligibility for one wayfinding slot, mirroring getScannerCandidates: flags
// anyone already presenting, already scanning, or already assigned to
// another overlapping wayfinding slot at the same time. If the slot has no
// time set yet there's nothing to check conflicts against, so everyone
// marked "Way Finder?" comes back eligible.
function getWayfindingCandidates(slot){
  const w = getWayfindingWindow(slot);
  return state.staff.filter(p=>p.canWayfind||p.canRegistration).map(p=>{
    if(!w) return { person:p, eligible:true, presenting:false, scanning:false, wayfindingElsewhere:false };
    const presenting = isPresentingDuringWindow(p.id, w.dayId, w.startMin, w.endMin);
    const scanning = isScanningDuringWindow(p.id, w.dayId, w.startMin, w.endMin);
    const wayfindingElsewhere = isWayfindingDuringWindow(p.id, w.dayId, w.startMin, w.endMin, slot.id);
    return { person:p, eligible: !presenting && !scanning && !wayfindingElsewhere, presenting, scanning, wayfindingElsewhere };
  }).sort((a,b)=> (a.eligible===b.eligible?0:a.eligible?-1:1) || a.person.name.localeCompare(b.person.name));
}

// Individual schedules show just the time range; the assignment text already
// says what the person is doing, so "Session 10" etc. would be redundant.
function slotNameOnly(label){
  const t = String(label||'').replace(/^\s*\d{1,2}:\d{2}(?:\s?[AP]M)?\s*[\u2013-]\s*\d{1,2}:\d{2}\s?[AP]M\s*/i,'').trim();
  return t || String(label||'');
}
function slotTimeOnly(label){
  const m = String(label||'').match(/^\s*(\d{1,2}:\d{2}(?:\s?[AP]M)?\s*[\u2013-]\s*\d{1,2}:\d{2}\s?[AP]M)/i);
  return m ? m[1].trim() : (label||'');
}
function minToHHMM(total){
  let m = ((total%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
const DAY_ORDER_IDX = {sat:0,sun:1,mon:2,tue:3,wed:4};
// Merges a person's normal day/slot assignments with their scan duties into
// one chronological list. includeAll=true keeps break/free rows too (for
// on-screen display); includeAll=false drops them (for ICS/PDF export).
function getScheduleRows(personId, includeAll){
  const entries = [];
  const pInfo = getPartnerPlanInfo(personId);
  state.days.forEach(d=>{
    d.slots.forEach(s=>{
      // A Sales person's assigned partner session replaces their normal
      // Session 6.5 row on Tuesday.
      if(pInfo && pInfo.session && d.id===PARTNER_SLOT.dayId && s.id===PARTNER_SLOT.slotId) return;
      const a = computeAssignment(personId, d.id, s.id);
      if(!includeAll && (a.type==='free' || (a.type==='break' && !/breakfast/i.test(s.label)))) return;
      const station = a.type==='station' ? getStation(a.stationId) : null;
      let text = (a.type==='allstaff'||a.type==='break') ? slotNameOnly(s.label) : assignmentLabel(a);
      if(station && station.type==='session' && station.room) text += ' \u2014 '+station.room;
      entries.push({dayId:d.id, dayName:d.name, slotLabel:slotTimeOnly(s.label), text, sortMin:startMinutes(s.start), isScan:false, start:s.start, end:s.end, color:getCategoryColor(station)});
    });
  });
  getPersonScanDuties(personId).forEach(({station,window})=>{
    entries.push({
      dayId: window.dayId, dayName: getDay(window.dayId).name,
      slotLabel: fmtMin(window.startMin)+'\u2013'+fmtMin(window.endMin),
      text: 'Scanning \u2014 '+station.name+(station.room?' \u2014 '+station.room:''), sortMin: window.startMin, isScan:true,
      start: minToHHMM(window.startMin), end: minToHHMM(window.endMin), color:CATEGORY_COLORS.scanning
    });
  });
  if(pInfo){
    if(pInfo.session){
      const d = getDay(PARTNER_SLOT.dayId), sl = d && d.slots.find(x=>x.id===PARTNER_SLOT.slotId);
      if(d && sl) entries.push({
        dayId:d.id, dayName:d.name, slotLabel:slotTimeOnly(sl.label),
        text:'Partner Session \u2014 '+pInfo.session.name+(pInfo.session.room?' \u2014 '+pInfo.session.room:''),
        sortMin:startMinutes(sl.start), isScan:false, start:sl.start, end:sl.end, color:CATEGORY_COLORS.partner
      });
    }
    if(pInfo.walk){
      const d = getDay(pInfo.walk.dayId);
      if(d) entries.push({
        dayId:d.id, dayName:d.name, slotLabel:fmtMin(pInfo.walk.startMin)+'\u2013'+fmtMin(pInfo.walk.endMin),
        text:'Partner Walk-through \u2014 take your clients to visit partners',
        sortMin:pInfo.walk.startMin, isScan:false, start:minToHHMM(pInfo.walk.startMin), end:minToHHMM(pInfo.walk.endMin), color:CATEGORY_COLORS.partner
      });
    }
  }
  getPersonWayfindingDuties(personId).forEach(s=>{
    const d = getDay(s.dayId);
    if(!d) return;
    const timeLabel = (s.start||s.end) ? ((s.start?fmtMin(startMinutes(s.start)):'?')+'\u2013'+(s.end?fmtMin(startMinutes(s.end)):'?')) : 'Time TBD';
    entries.push({
      dayId: s.dayId, dayName: d.name,
      slotLabel: timeLabel, text: (s.title||'Wayfinding')+(s.note?' \u2014 '+s.note:''),
      sortMin: startMinutes(s.start), isScan:false, start:s.start||'', end:s.end||'', color:CATEGORY_COLORS.wayfinding
    });
  });
  entries.sort((a,b)=> (DAY_ORDER_IDX[a.dayId]-DAY_ORDER_IDX[b.dayId]) || (a.sortMin-b.sortMin));
  return entries;
}

// ---------- render dispatch ----------
function render(){
  if(!isAdmin){ renderStaffView(); return; }
  navEl.style.display = '';
  if(saveStatus.textContent==='view-only schedule directory') saveStatus.textContent='';
  renderAdminBar();
  navEl.innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${state.activeTab===t.id?'active':''}">${t.label}</button>`).join('');
  navEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{ updateLocal(st=>st.activeTab=b.dataset.tab); });

  // Re-rendering replaces bodyEl's innerHTML, which would otherwise reset
  // every scrollable list back to the top on every single edit. Snapshot
  // scroll positions first, then restore them once the new DOM is in.
  const scrollers = Array.from(bodyEl.querySelectorAll('.scrolly, .scrollx'));
  const scrollState = scrollers.map(el=>({top:el.scrollTop, left:el.scrollLeft}));
  const pageY = window.scrollY, pageX = window.scrollX;

  if(state.activeTab==='setup') renderSetup();
  else if(state.activeTab==='grid') renderGrid();
  else if(state.activeTab==='sessions') renderSessions();
  else if(state.activeTab==='coverage') renderCoverage();
  else if(state.activeTab==='scanning') renderScanning();
  else if(state.activeTab==='wayfind_reg') renderWayfindReg();
  else if(state.activeTab==='partners') renderPartners();
  else if(state.activeTab==='readiness') renderReadiness();
  else if(state.activeTab==='people') renderPeople();
  else if(state.activeTab==='export') renderExport();

  const newScrollers = Array.from(bodyEl.querySelectorAll('.scrolly, .scrollx'));
  newScrollers.forEach((el,i)=>{
    const prev = scrollState[i];
    if(prev){ el.scrollTop = prev.top; el.scrollLeft = prev.left; }
  });
  window.scrollTo(pageX, pageY);
}

function renderAdminBar(){
  let bar = document.getElementById('admin-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'admin-bar';
    bar.className = 'admin-bar';
    root.insertBefore(bar, navEl);
  }
  bar.innerHTML = `<span>Admin mode <span style="opacity:.75;font-weight:400">(Data v${SEED_VERSION} · ${state.staff.length} staff)</span></span><button class="btn sm ghost" id="admin-logout">Switch to Staff View</button>`;
  document.getElementById('admin-logout').onclick = async ()=>{
    try{ await supabase.auth.signOut(); }catch(e){}
    isAdmin = false;

}

let staffViewQuery = '';

function renderStaffView(){
  navEl.style.display = 'none';
  const bar = document.getElementById('admin-bar');
  if(bar) bar.remove();
  saveStatus.textContent = 'view-only schedule directory';

  bodyEl.innerHTML = `
    <div class="panel">
      <label class="small">Find your name</label>
      <input type="text" id="sv-search" placeholder="Type a name…" style="width:280px" value="${esc(staffViewQuery)}">
      <div id="sv-results" style="margin-top:8px"></div>
    </div>

    <div style="text-align:center;margin-top:18px">
      <button class="btn sm ghost" id="sv-admin-link" style="font-size:11px;opacity:.6">Admin Access</button>
    </div>
  `;

  const resultsEl = document.getElementById('sv-results');
  const detailEl = document.getElementById('sv-detail');
  const searchEl = document.getElementById('sv-search');

  function drawResults(){
    if(!staffViewQuery){ resultsEl.innerHTML=''; return; }
    const matches = state.staff.filter(p=>p.name.toLowerCase().includes(staffViewQuery.toLowerCase())).sort(byFirstName).slice(0,10);

  }
  searchEl.oninput = (e)=>{ staffViewQuery = e.target.value; drawResults(); };
  searchEl.focus();

  function drawDetail(){
    const p = staffViewSelectedId ? getStaff(staffViewSelectedId) : null;
    if(!p){ detailEl.innerHTML = '<div class="muted">Search and select your name above to view your schedule.</div>'; return; }
    const rowsHtml = getScheduleRows(p.id, true).map(r=>
      `<tr><td class="pill">${esc(r.dayName)}</td><td>${esc(r.slotLabel)}</td><td${r.color?` style="background:${r.color}"`:''}>${esc(r.text)}${r.isScan?' <span class="badge over">scan duty</span>':''}</td></tr>`
    ).join('');
    detailEl.innerHTML = `
      <div class="person-card">
        <div class="flex-between">
          <div><h2>${esc(p.name)}</h2><span class="muted">${esc(p.dept||'')} ${p.notes?(' · '+esc(p.notes)):''}</span></div>

        </div>

          <table><thead><tr><th>Day</th><th>Time</th><th>Assignment</th></tr></thead><tbody>${rowsHtml}</tbody></table>
        </div>
      </div>
    `;
    document.getElementById('sv-ics').onclick = ()=>downloadICS(p);
    document.getElementById('sv-pdf').onclick = ()=>downloadPDF(p);
  }
  drawResults();
  drawDetail();

  document.getElementById('sv-admin-link').onclick = showLoginModal;
}

    update(st=>{
      lines.forEach(line=>{
        const parts = line.split(',').map(x=>x.trim());
        const name = parts[0]||'Unnamed';
        const dept = parts[1]||'';
        const stationName = parts[2]||'';
        const stationName2 = parts[3]||'';
        const match = st.stations.find(s=>s.name.toLowerCase()===stationName.toLowerCase());
        const match2 = st.stations.find(s=>s.name.toLowerCase()===stationName2.toLowerCase());
        const unmatchedNotes = [];
        if(!match && stationName) unmatchedNotes.push('unmatched station: '+stationName);
        if(!match2 && stationName2) unmatchedNotes.push('unmatched station 2: '+stationName2);
        st.staff.push({id:uid('st'), name, dept, homeStationId: match?match.id:'', homeStationId2: match2?match2.id:'', notes: unmatchedNotes.join('; ')});
      });
    });
    document.getElementById('bulk-paste').value='';
  };
}

    </span></div>
    <div class="day-tabs" id="grid-daytabs"></div>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="grid-search" placeholder="Search staff…" style="width:220px">
      <button class="btn sm ghost" id="grid-clear-overrides">Clear all overrides for this day</button>
    </div>
    <div class="scrollx scrolly">
      <table><thead><tr><th style="min-width:160px">Name</th><th>Home Station</th>${day.slots.map(s=>`<th>${esc(s.label)}</th>`).join('')}</tr></thead>
      <tbody id="grid-rows"></tbody></table>
    </div>
  `;
  const dt = document.getElementById('grid-daytabs');
  dt.innerHTML = state.days.map(d=>`<button class="btn sm ${state.activeDayId===d.id?'active':'ghost'}" data-day="${d.id}">${d.name}</button>`).join('');
  dt.querySelectorAll('button').forEach(b=>b.onclick=()=>updateLocal(st=>st.activeDayId=b.dataset.day));

  function drawRows(filter){
    const rows = document.getElementById('grid-rows');
    const list = state.staff.filter(p=>!filter || p.name.toLowerCase().includes(filter.toLowerCase())).sort(byFirstName);
    rows.innerHTML = list.map(p=>{
      const home = getStation(p.homeStationId);
      const home2 = getStation(p.homeStationId2);
      return `<tr>
        <td>${esc(p.name)}</td>
        <td><span class="pill"${getCategoryColor(home)?` style="background:${getCategoryColor(home)};border-color:transparent"`:''}>${home?esc(home.name):'—'}</span>${home2?` <span class="pill"${getCategoryColor(home2)?` style="background:${getCategoryColor(home2)};border-color:transparent"`:''}>${esc(home2.name)}</span>`:''}</td>
        ${day.slots.map(s=>{
          const a = computeAssignment(p.id, day.id, s.id);
          const key = p.id+'|'+day.id+'|'+s.id;
          const overridden = state.overrides[key]!==undefined;
          const cellStation = a.type==='station' ? getStation(a.stationId) : null;
          const cellColor = getCategoryColor(cellStation);
          return `<td>
            <select class="grid-cell-select" data-pid="${p.id}" data-slot="${s.id}" style="${overridden?'border-color:var(--amber-dk);font-weight:700;':''}${cellColor?`background:${cellColor};`:''}">
              <option value="__auto__">${assignmentLabel(computeAssignmentAuto(p.id,day.id,s.id))} ${overridden?'':''}</option>
              ${s.type==='coverage' ? state.stations.filter(st2=>st2.activeDayIds.includes(day.id)).map(st2=>`<option value="station:${st2.id}" ${a.type==='station'&&a.stationId===st2.id&&overridden?'selected':''}>${esc(st2.name)}</option>`).join('') : ''}
              <option value="free" ${a.type==='free'&&overridden?'selected':''}>Free / Bench</option>
              ${overridden?'<option value="__reset__">↺ Reset to automatic</option>':''}
            </select>
            ${(s.type==='coverage' && a.type==='station') ? `<button class="btn sm ghost" style="padding:2px 4px;font-size:10.5px;margin-top:3px;width:100%;display:block;box-sizing:border-box" data-fill-day="${day.id}" data-fill-slot="${s.id}" data-fill-station="${a.stationId}" title="Find someone to fill this spot if reassigned">Fill</button>` : ''}
          </td>`;
        }).join('')}
      </tr>`;
    }).join('');
    rows.querySelectorAll('select').forEach(sel=>{
      sel.onchange = ()=>{
        const pid = sel.dataset.pid, slotId = sel.dataset.slot;
        const v = sel.value;
        if(v==='__auto__') return;
        if(v==='__reset__'){ setOverride(pid, day.id, slotId, null); return; }
        if(v==='free'){ setOverride(pid, day.id, slotId, {type:'free'}); return; }
        if(v.startsWith('station:')){ setOverride(pid, day.id, slotId, {type:'station', stationId:v.slice(8)}); return; }
      };
    });
    rows.querySelectorAll('[data-fill-station]').forEach(b=>{
      b.onclick = ()=> openFillPanel(b.dataset.fillDay, b.dataset.fillSlot, b.dataset.fillStation);
    });
  }
  function computeAssignmentAuto(staffId,dayId,slotId){
    // ignore overrides, for showing the "automatic" option label
    const day2 = getDay(dayId);
    const slot = day2.slots.find(s=>s.id===slotId);
    if(slot.type==='allstaff') return {type:'allstaff', label:slot.label};
    if(slot.type==='break') return {type:'break'};
    const person = getStaff(staffId);
    const station = person? getStation(person.homeStationId): null;
    if(station && station.activeDayIds.includes(dayId)) return {type:'station', stationId:station.id};
    return {type:'free'};
  }
  drawRows('');
  document.getElementById('grid-search').oninput = (e)=>drawRows(e.target.value);
  document.getElementById('grid-clear-overrides').onclick = ()=>{
    const n = Object.keys(state.overrides).filter(k=>k.includes('|'+day.id+'|')).length;
    customConfirm(`This removes all ${n} manual assignments for ${day.name} \u2014 including every session presenter \u2014 and puts everyone back on their home station. This can't be undone. Continue?`, (ok)=>{
      if(!ok) return;
      update(st=>{
        Object.keys(st.overrides).forEach(k=>{ if(k.includes('|'+day.id+'|')) delete st.overrides[k]; });
      });
    }, 'Clear all overrides for '+day.name);
  };
}

// ---------- SCANNING TAB ----------
function scanGridHtml(daySessions){
  const roomOf = x=>{
    let r = String(x.room||'').trim().replace(/^#\s*/,'');
    if(!r) return '(no room)';
    if(/^\d+$/.test(r)) r = 'Room '+r;
    return r;
  };
  const slotIds = [];
  daySessions.forEach(x=>{ if(!slotIds.includes(x.scanSlotId)) slotIds.push(x.scanSlotId); });
  const day = getDay(state.activeDayId);
  const slotInfo = id=>{ const sl = day && day.slots.find(z=>z.id===id); return { id, start: sl?startMinutes(sl.start):0, startStr: sl?sl.start:'' }; };
  const cols = slotIds.map(slotInfo).sort((a,b)=>a.start-b.start);
  const rooms = [];
  daySessions.forEach(x=>{ const r = roomOf(x); if(!rooms.includes(r)) rooms.push(r); });
  rooms.sort((a,b)=>{
    const na = parseInt((a.match(/\d+/)||[])[0],10), nb = parseInt((b.match(/\d+/)||[])[0],10);
    if(!isNaN(na) && !isNaN(nb) && na!==nb) return na-nb;
    return a.localeCompare(b);
  });
  if(!cols.length) return '';
  const unfilled = daySessions.filter(x=>!state.scanAssignments[x.id]).length;
  return `<div class="flex-between" style="margin:18px 0 6px">
      <h3 style="margin:0">Room Coverage Grid</h3>
      <span class="row"><span class="pill">${daySessions.length-unfilled} of ${daySessions.length} covered on ${esc(day?day.name:'')}</span><span class="pill">${daySessions.filter(x=>state.scanAssignments[x.id] && state.scanPickedUp && state.scanPickedUp[x.id]===state.scanAssignments[x.id]).length} scanners picked up</span></span>
    </div>
    <div class="muted" style="margin-bottom:8px">Read-only view of the day selected above: rooms down the side, session times across the top. Each cell shows who is scanning the session in that room; red means nobody yet. Tick the box once that scanner has picked up their scanner from the reg desk (the cell turns green). Assign people in the Assign Scanners table below.</div>
    <div class="scrollx scrolly" style="max-height:70vh"><table style="border-collapse:collapse;width:100%">
      <thead><tr><th style="text-align:left;position:sticky;left:0;background:#d9edf7">Room</th>${cols.map(c=>`<th>${fmtMin(c.start)}<div class="muted" style="font-weight:400">scan ${fmtMin(c.start-15)}\u2013${fmtMin(c.start+15)}</div></th>`).join('')}</tr></thead>
      <tbody>${rooms.map(r=>`<tr><td style="font-weight:600;white-space:nowrap;position:sticky;left:0;background:#fff">${esc(r)}</td>${cols.map(c=>{
        const here = daySessions.filter(x=>roomOf(x)===r && x.scanSlotId===c.id);
        return `<td style="vertical-align:top;min-width:150px">${here.map(x=>{
          const pid = state.scanAssignments[x.id];
          const person = pid ? getStaff(pid) : null;
          const title = esc(x.name.length>46 ? x.name.slice(0,45)+'\u2026' : x.name);
          const got = person && state.scanPickedUp && state.scanPickedUp[x.id]===pid;
          return person
            ? `<div style="background:${got?'#C6E0B4':'#F4B6C266'};border-left:4px solid ${got?'#5a9a3a':'#F4B6C2'};padding:3px 6px;margin-bottom:3px;border-radius:3px"><label style="display:flex;gap:6px;align-items:flex-start;cursor:pointer"><input type="checkbox" data-scan-pick="${x.id}" data-scan-person="${pid}" ${got?'checked':''} style="margin-top:3px"><span><b>${esc(person.name)}</b><div class="muted" style="font-size:11px">${title}</div></span></label></div>`
            : `<div style="background:#fde2e2;border-left:4px solid #d33;color:#a00;padding:3px 6px;margin-bottom:3px;border-radius:3px"><b>Unassigned</b><div style="font-size:11px">${title}</div></div>`;
        }).join('')}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderScanning(){
  const scannerPool = state.staff.filter(p=>p.canScan);
  const allSessions = state.stations.filter(s=>s.type==='session' && s.scanDayId && s.scanSlotId);
  const dayOrder = {sat:0,sun:1,mon:2,tue:3,wed:4};
  const daySessions = allSessions.filter(s=>s.scanDayId===state.activeDayId).sort((a,b)=>{
    const wa = getScanWindow(a), wb = getScanWindow(b);
    return (wa?wa.startMin:0) - (wb?wb.startMin:0);
  });
  const totalUnassigned = allSessions.filter(s=>!state.scanAssignments[s.id]).length;

  // Count how many scan duties each eligible scanner currently holds,
  // across all days (not just the day currently showing in the table above).
  const scanCounts = {};
  Object.values(state.scanAssignments).forEach(pid=>{ scanCounts[pid] = (scanCounts[pid]||0) + 1; });
  const scannersWithDuty = scannerPool.filter(p=>scanCounts[p.id] > 0).length;
  const marketingScanners = scannerPool.filter(isMarketingScanner).sort(byFirstName);
  const backupScanners = scannerPool.filter(p=>!isMarketingScanner(p)).sort(byFirstName);

  bodyEl.innerHTML = `
    <div class="note">Every session needs one scanner covering the 15 minutes before it starts through 15 minutes after (30 min total). Only people marked "Scanner?" in Setup show up as candidates here, and anyone already presenting or scanning something else in that window is automatically excluded. \u2726 marks Marketing staff, the primary scanner pool — Auto-assign fills from them first and only falls back to everyone else as backup once Marketing candidates are unavailable. \u2605 marks candidates whose home pod suggests they'd know this session's subject matter, used as a tiebreaker within each pool.</div>
    <div class="flex-between" style="margin-bottom:10px">
      <div class="day-tabs" id="scan-daytabs" style="margin-bottom:0"></div>
      <div class="row">
        <span class="pill">${scannerPool.length} eligible scanners</span>
        <span class="pill">${totalUnassigned} of ${allSessions.length} sessions unassigned</span>
        <button class="btn sm ghost" id="scan-clearall">Clear all assignments</button>
        <button class="btn sm amber" id="scan-autoassign">Auto-assign unfilled</button>
      </div>
    </div>
    ${scanGridHtml(daySessions)}
    <div class="flex-between" style="margin:18px 0 6px"><h3 style="margin:0">Assign Scanners</h3></div>
    <div class="scrollx scrolly">
      <table><thead><tr><th>Time (scan window)</th><th>Session</th><th>Assigned Scanner</th></tr></thead>
      <tbody>${daySessions.map(s=>{
        const w = getScanWindow(s);
        const winLabel = w ? (fmtMin(w.startMin)+' \u2013 '+fmtMin(w.endMin)) : '\u2014';
        const candidates = getScannerCandidates(s);
        const assignedId = state.scanAssignments[s.id] || '';
        const assignedPerson = assignedId ? getStaff(assignedId) : null;
        const assignedIneligible = assignedPerson && !candidates.find(c=>c.person.id===assignedId && c.eligible);
        return `<tr>
          <td class="mono">${winLabel}<div class="muted" style="font-weight:400">session starts ${esc(w?w.sessionStart:'')}</div></td>
          <td>${esc(s.name)}${s.room?` <span class="pill">${esc(s.room)}</span>`:''}</td>
          <td>
            <select data-scan-station="${s.id}">
              <option value="">\u2014 unassigned \u2014</option>
              ${assignedPerson ? `<option value="${assignedPerson.id}" selected>${esc(assignedPerson.name)}${assignedIneligible?' (no longer eligible \u2014 conflict)':''}</option>` : ''}
              ${candidates.filter(c=>c.eligible && c.person.id!==assignedId).map(c=>`<option value="${c.person.id}">${c.marketing?'\u2726 ':''}${c.topicMatch?'\u2605 ':''}${esc(c.person.name)}${c.marketing?' (Marketing)':''}</option>`).join('')}
            </select>
          </td>
        </tr>`;
      }).join('') || `<tr><td colspan="3" class="muted">No sessions on this day.</td></tr>`}
      </tbody></table>
    </div>

    <div class="flex-between" style="margin:18px 0 10px">
      <h3 style="margin:0">Scanners</h3>
      <span class="pill">${scannersWithDuty} of ${scannerPool.length} scanners assigned at least one session</span>
    </div>
    <div class="scrollx scrolly">
      <table><thead><tr><th>Scanner</th><th>Scan duties assigned (all days)</th></tr></thead>
      <tbody>
        ${marketingScanners.length ? `<tr><td colspan="2" class="muted" style="font-weight:700">✦ Marketing (primary pool)</td></tr>` : ''}
        ${marketingScanners.map(p=>{
          const count = scanCounts[p.id] || 0;
          return `<tr>
            <td>${esc(p.name)}</td>
            <td class="mono">${count}${count===0?' <span class="muted" style="font-weight:400">(none yet)</span>':''}</td>
          </tr>`;
        }).join('')}
        ${backupScanners.length ? `<tr><td colspan="2" class="muted" style="font-weight:700">Backup (other departments)</td></tr>` : ''}
        ${backupScanners.map(p=>{
          const count = scanCounts[p.id] || 0;
          return `<tr>
            <td>${esc(p.name)}</td>
            <td class="mono">${count}${count===0?' <span class="muted" style="font-weight:400">(none yet)</span>':''}</td>
          </tr>`;
        }).join('')}
        ${scannerPool.length===0 ? `<tr><td colspan="2" class="muted">No one is marked as a scanner yet — set that in Setup.</td></tr>` : ''}
      </tbody></table>
    </div>
  `;
  const dt = document.getElementById('scan-daytabs');
  dt.innerHTML = state.days.map(d=>`<button class="btn sm ${state.activeDayId===d.id?'active':'ghost'}" data-day="${d.id}">${d.name}</button>`).join('');
  dt.querySelectorAll('button').forEach(b=>b.onclick=()=>updateLocal(st=>st.activeDayId=b.dataset.day));

  bodyEl.querySelectorAll('[data-scan-station]').forEach(sel=>{
    sel.onchange = ()=>update(st=>{
      if(sel.value) st.scanAssignments[sel.dataset.scanStation] = sel.value;
      else delete st.scanAssignments[sel.dataset.scanStation];
    });
  });
  bodyEl.querySelectorAll('[data-scan-pick]').forEach(cb=>{
    cb.onchange = ()=>{
      const box = cb.closest('.scrollx'), top = box?box.scrollTop:0, left = box?box.scrollLeft:0, wy = window.scrollY;
      const sid = cb.dataset.scanPick, pid = cb.dataset.scanPerson, on = cb.checked;
      update(st=>{
        if(!st.scanPickedUp) st.scanPickedUp = {};
        if(on) st.scanPickedUp[sid] = pid; else delete st.scanPickedUp[sid];
      });
      const nb = bodyEl.querySelector('[data-scan-pick]'); const b2 = nb && nb.closest('.scrollx');
      if(b2){ b2.scrollTop = top; b2.scrollLeft = left; }
      window.scrollTo(0, wy);
    };
  });
  document.getElementById('scan-clearall').onclick = ()=>{
    customConfirm(`This unassigns all ${allSessions.length - totalUnassigned} currently-assigned scan duties, across every day, so you can re-run Auto-assign from scratch. This can't be undone. Continue?`, (ok)=>{
      if(!ok) return;
      update(st=>{ st.scanAssignments = {}; });
    }, 'Clear all scan assignments');
  };
  document.getElementById('scan-autoassign').onclick = ()=>update(st=>{
    const sessions = st.stations.filter(s=>s.type==='session' && s.scanDayId && s.scanSlotId).sort((a,b)=>{
      const da = dayOrder[a.scanDayId]-dayOrder[b.scanDayId];
      if(da!==0) return da;
      const wa = getScanWindow(a), wb = getScanWindow(b);
      return (wa?wa.startMin:0) - (wb?wb.startMin:0);
    });
    const usage = {};
    st.staff.forEach(p=>{ if(p.canScan) usage[p.id]=0; });
    Object.values(st.scanAssignments).forEach(pid=>{ if(usage[pid]!==undefined) usage[pid]++; });
    sessions.forEach(s=>{
      if(st.scanAssignments[s.id]) return;
      const cands = getScannerCandidates(s).filter(c=>c.eligible);
      if(!cands.length) return;
      cands.sort((a,b)=>
        // Marketing staff are the primary scanner pool; everyone else is backup
        // and should only be picked once marketing candidates are exhausted
        // or unavailable for this session.
        (a.marketing===b.marketing?0:a.marketing?-1:1) ||
        (!!a.person.canScan===!!b.person.canScan?0:a.person.canScan?-1:1) ||
        (a.topicMatch===b.topicMatch?0:a.topicMatch?-1:1) ||
        (usage[a.person.id]||0)-(usage[b.person.id]||0) ||
        a.person.name.localeCompare(b.person.name)
      );
      const chosen = cands[0].person;
      st.scanAssignments[s.id] = chosen.id;
      usage[chosen.id] = (usage[chosen.id]||0)+1;
    });
  });
}

// ---------- WAY FINDERS & REGISTRATION ----------
// Registration stays a simple eligibility list (unchanged). Wayfinding now
// also gets real slots — each a day + time window + a free-text note
// describing where/what ("Front of hotel", "2nd floor near elevators",
// etc.) + an assigned person — built the same shape as the Scanning tab's
// per-session assignment, but free-form instead of tied to a session list,
// since wayfinding posts aren't fixed ahead of time the way sessions are.
// No conflict-checking against someone's other duties yet (Scanning has
// that; this doesn't) — keep an eye out for double-booking yourself for now.
function getWayfindingSlots(){
  if(!Array.isArray(state.wayfindingSlots)) state.wayfindingSlots = [];
  return state.wayfindingSlots;
}
let wfDayFilter = 'all';
let wfGridDay = '';
const WF_GRID_COLORS = { 'Reg Desk':'#C6E0B4','Ecosystem Doors':'#BDD7EE','Bracelet Handout':'#FFD966','Seat Ushers':'#F8CBAD','Wayfinding':'#F4B6C2','Staff Attire':'#D9D2E9','Badge Check - Exhibitor Load In':'#B2DFDB','Badge Check - Welcome Reception':'#B2DFDB','UG Happy Hour Set Up':'#E0E0E0' };
function drawWfGrid(allSlots){
  const panel = document.getElementById('wf-grid-panel');
  if(!panel) return;
  const days = state.days.filter(d=>allSlots.some(x=>x.dayId===d.id && x.start && x.end));
  if(!days.length){ panel.innerHTML = '<h2>Posts Grid</h2><div class="muted">Add wayfinding slots with times to see the grid.</div>'; return; }
  if(!days.find(d=>d.id===wfGridDay)) wfGridDay = days[0].id;
  const slots = allSlots.filter(x=>x.dayId===wfGridDay && x.start && x.end);
  const titleOf = x=>x.title || 'Wayfinding';
  const posts = []; slots.forEach(x=>{ if(!posts.includes(titleOf(x))) posts.push(titleOf(x)); });
  const blocks = []; slots.forEach(x=>{ const k = x.start+'|'+x.end; if(!blocks.includes(k)) blocks.push(k); });
  blocks.sort((a,b)=>startMinutes(a.split('|')[0])-startMinutes(b.split('|')[0]) || startMinutes(a.split('|')[1])-startMinutes(b.split('|')[1]));
  const col = t=>WF_GRID_COLORS[t] || CATEGORY_COLORS.wayfinding;
  const unfilled = slots.filter(x=>!x.assignedId).length;
  panel.innerHTML = `
    <div class="flex-between" style="margin-bottom:6px">
      <h2 style="margin-bottom:0">Posts Grid <span class="pill">${slots.length} posts \u00b7 ${unfilled} unassigned</span></h2>
      <div class="day-tabs" id="wfg-days">${days.map(d=>`<button class="btn sm ${wfGridDay===d.id?'active':'ghost'}" data-wfgday="${d.id}">${esc(d.name)}</button>`).join('')}</div>
    </div>
    <div class="muted" style="margin-bottom:8px">Read-only view: rows are time blocks, columns are posts. Assign people in the Wayfinding Assignments table below. Red = unassigned.</div>
    <div class="scrollx"><table style="border-collapse:collapse;width:100%"><thead><tr><th style="text-align:left">Time</th>${posts.map(t=>`<th style="background:${col(t)}">${esc(t)}</th>`).join('')}</tr></thead>
    <tbody>${blocks.map(b=>{
      const [a,z] = b.split('|');
      return `<tr><td class="mono" style="white-space:nowrap;font-weight:600">${fmtMin(startMinutes(a))}\u2013${fmtMin(startMinutes(z))}</td>${posts.map(t=>{
        const here = slots.filter(x=>titleOf(x)===t && x.start===a && x.end===z);
        return `<td style="vertical-align:top">${here.map(x=>{

// ---------- PARTNER SESSIONS TAB ----------
// Sales people marked "Sales?" on the roster each get two things:
//  1) one partner session in Tuesday's Session 6.5 block (11:35-12:15), and
//  2) a 30-minute walk-through slot during a break or lunch, to take their
//     clients around to visit partners.
// Both flow into Individual Schedules, Staff View, the PDF and the calendar.
// They are stored separately from station overrides on purpose: attending a
// session / walking clients isn't "staffing" a station, so Coverage counts
// are not affected.
const PARTNER_SLOT = { dayId:'tue', slotId:'tue_partners' };
// Each partner session gets a linked station (hidden from the Sessions tab) so
// it flows through the normal scanning machinery: Scanning tab, schedules, PDF,
// conflict checks. Kept in step with the partner list by this function.
function syncPartnerStations(st){
  const list = Array.isArray(st.partnerSessions) ? st.partnerSessions : [];
  const ids = new Set();
  list.forEach(ps=>{
    const id = 'sesst_ps_'+ps.id; ids.add(id);
    let x = st.stations.find(y=>y.id===id);
    if(!x){ x = { id, type:'session', activeDayIds:[PARTNER_SLOT.dayId], required:2, partnerSessionId:ps.id }; st.stations.push(x); }
    x.name = 'Partner Session: '+(ps.name||'(unnamed)');
    x.room = ps.room||'';
    x.scanDayId = PARTNER_SLOT.dayId; x.scanSlotId = PARTNER_SLOT.slotId;
    x.sessDayId = PARTNER_SLOT.dayId; x.sessSlotId = PARTNER_SLOT.slotId;
  });
  st.stations = st.stations.filter(x=>{
    if(!x.partnerSessionId || ids.has(x.id)) return true;
    if(st.scanAssignments) delete st.scanAssignments[x.id];
    return false;
  });
}
function getPartnerSessions(){ if(!Array.isArray(state.partnerSessions)) state.partnerSessions = []; return state.partnerSessions; }
function getPartnerPlans(){ if(!state.partnerPlans || typeof state.partnerPlans!=='object') state.partnerPlans = {}; return state.partnerPlans; }
function getPartnerSessionWindow(){
  const d = getDay(PARTNER_SLOT.dayId), sl = d && d.slots.find(x=>x.id===PARTNER_SLOT.slotId);
  if(!sl) return null;
  return { dayId:d.id, startMin:startMinutes(sl.start), endMin:startMinutes(sl.end), label:sl.label };
}
// Break and lunch windows that are long enough (30+ min) for a walk-through.
function getPartnerWalkWindows(){
  const out = [];
  state.days.forEach(d=>d.slots.forEach(sl=>{
    if(sl.type==='allstaff') return;
    if(!/\bbreak\b|lunch/i.test(sl.label)) return;
    const a = startMinutes(sl.start), b = startMinutes(sl.end);
    if(b-a < 30) return;
    out.push({ key:d.id+'|'+sl.id, dayId:d.id, dayName:d.name, slotId:sl.id, startMin:a, endMin:b, label:d.name+' — '+sl.label });
  }));
  return out;
}
function getPartnerPlanInfo(personId){
  const p = getStaff(personId);
  if(!p || !p.isSales) return null;
  const plan = getPartnerPlans()[personId];
  if(!plan) return null;
  const session = plan.sessionId ? getPartnerSessions().find(x=>x.id===plan.sessionId) : null;
  let walk = null;
  if(plan.walkKey && plan.walkStart){
    const w = getPartnerWalkWindows().find(x=>x.key===plan.walkKey);
    if(w){ const a = startMinutes(plan.walkStart); walk = { dayId:w.dayId, startMin:a, endMin:a+30 }; }
  }
  if(!session && !walk) return null;
  return { session, walk };
}
// Why someone can't be somewhere for a given window (empty string = free).
// `ignore` = 'session' or 'walk' skips that part of their own plan.
function partnerBusyReason(personId, dayId, startMin, endMin, ignore){
  if(isPresentingDuringWindow(personId, dayId, startMin, endMin)) return 'presenting';
  if(isScanningDuringWindow(personId, dayId, startMin, endMin, null)) return 'scanning';
  if(isWayfindingDuringWindow(personId, dayId, startMin, endMin, null)) return 'wayfinding';
  const plan = getPartnerPlans()[personId];
  if(plan){
    const sw = getPartnerSessionWindow();
    if(ignore!=='session' && plan.sessionId && sw && sw.dayId===dayId && sw.startMin<endMin && sw.endMin>startMin) return 'partner session';
    if(ignore!=='walk' && plan.walkKey && plan.walkStart){
      const w = getPartnerWalkWindows().find(x=>x.key===plan.walkKey);
      if(w && w.dayId===dayId){
        const a = startMinutes(plan.walkStart);
        if(a<endMin && a+30>startMin) return 'partner walk';
      }
    }
  }
  return '';
}
function ensurePartnerPlan(pid){
  const plans = getPartnerPlans();
  if(!plans[pid]) plans[pid] = { sessionId:'', walkKey:'', walkStart:'' };
  return plans[pid];
}

  const sessCount = {};
  sales.forEach(p=>{ const pl = plans[p.id]; if(pl && pl.sessionId) sessCount[pl.sessionId] = (sessCount[pl.sessionId]||0)+1; });
  const needSession = sales.filter(p=>!(plans[p.id] && plans[p.id].sessionId)).length;
  const needWalk = sales.filter(p=>!(plans[p.id] && plans[p.id].walkKey && plans[p.id].walkStart)).length;

  const personRow = p=>{
    const pl = plans[p.id] || {};

      <td>${warns.length ? `<span class="badge short">${esc(warns.join('; '))}</span>` : (pl.sessionId && pl.walkKey && pl.walkStart ? '<span class="badge ok">done</span>' : '<span class="muted">incomplete</span>')}</td>
    </tr>`;
  };

  bodyEl.innerHTML = `
    <div class="panel">
      <div class="flex-between" style="margin-bottom:6px">
        <h2 style="margin-bottom:0">Partner Sessions${sw ? ' — Tuesday '+esc(sw.label) : ''}</h2>
        <button class="btn sm ghost" id="ps-add">+ Add partner session</button>
      </div>
      <div class="muted" style="margin-bottom:8px">Add each partner session that runs in the Session 6.5 block. Capacity is optional — leave blank for no limit. Each partner session also needs a scanner (11:20\u201311:50 AM): pick one here or on the Scanning tab.</div>
      <table><thead><tr><th>Partner session</th><th>Room</th><th>Capacity</th><th>Assigned</th><th>Scanner</th><th></th></tr></thead>
      <tbody>${sessions.map(s=>`<tr>
        <td><input type="text" data-psf="name" data-psid="${s.id}" value="${esc(s.name||'')}" placeholder="Partner / session name" style="width:300px"></td>
        <td><input type="text" data-psf="room" data-psid="${s.id}" value="${esc(s.room||'')}" placeholder="Room" style="width:110px"></td>
        <td><input type="text" data-psf="capacity" data-psid="${s.id}" value="${esc(s.capacity||'')}" style="width:70px"></td>
        <td class="mono">${sessCount[s.id]||0}</td>
        <td>${(()=>{
          const stn = getStation('sesst_ps_'+s.id);
          if(!stn) return '<span class="muted">\u2014</span>';

          const aid = state.scanAssignments[stn.id] || '';
          const ap = aid ? getStaff(aid) : null;

        })()}</td>
        <td><button class="btn sm ghost" data-ps-remove="${s.id}">Remove</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">No partner sessions yet — click "+ Add partner session".</td></tr>'}</tbody></table>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="flex-between" style="margin-bottom:6px">
        <h2 style="margin-bottom:0">Sales People</h2>

      <div class="scrollx scrolly">
        <table><thead><tr><th>Name</th><th>Department</th><th>Partner session</th><th>Walk-through window</th><th>30-min start</th><th>Status</th></tr></thead>
        <tbody>${sales.map(personRow).join('') || '<tr><td colspan="6" class="muted">Nobody is marked "Sales?" yet — check the box in Setup → Staff Roster.</td></tr>'}</tbody></table>
