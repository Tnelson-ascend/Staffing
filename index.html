      const pl = ensurePartnerPlan(p.id);
      if(pl.walkKey && pl.walkStart) return;
      const open = slots.filter(x=>!partnerBusyReason(p.id, x.dayId, x.start, x.start+30, 'walk')).sort((a,b)=>a.n-b.n);
      if(!open.length) return;
      pl.walkKey = open[0].key; pl.walkStart = minToHHMM(open[0].start); open[0].n++;
    });
  });
  document.getElementById('pp-clear').onclick = ()=>{
    customConfirm('This clears every partner session and walk-through assignment for all Sales people so you can start over. This can\'t be undone. Continue?', (ok)=>{
      if(!ok) return;
      update(st=>{ st.partnerPlans = {}; });
    }, 'Clear partner assignments');
  };
}

// ---------- SESSIONS TAB ----------
// One place to edit every session: title, room, day, time slot, presenters,
// and whether it needs a scanner. Changes save to the shared board right
// away, so no new index.html is needed for agenda changes.
let sessionsQuery = '', sessionsDayFilter = 'all';
function sessionDaySlot(s){
  return {
    dayId: s.sessDayId || s.scanDayId || (s.activeDayIds && s.activeDayIds[0]) || '',
    slotId: s.sessSlotId || s.scanSlotId || ''
  };
}
function sessionSlotChoices(dayId){
  const d = getDay(dayId);
  return d ? d.slots.filter(sl=>/sess_slot|partners/.test(sl.id)) : [];
}
function getSessionPresenterIds(sid){
  const out = [];
  for(const k in state.overrides){
    const v = state.overrides[k];
    if(v && v.type==='station' && v.stationId===sid){ const pid = k.split('|')[0]; if(!out.includes(pid)) out.push(pid); }
  }
  return out;
}
// Moves a session (and its presenters' assignments) to a new day/slot.
// Returns the list of people who'd be double-booked; nothing changes if any.
function moveSessionTo(st, sid, newDay, newSlot, dryRun){
  const s = st.stations.find(x=>x.id===sid);
  if(!s) return [];
  const keys = Object.keys(st.overrides).filter(k=>{ const v = st.overrides[k]; return v && v.stationId===sid; });
  const blocked = [];
  keys.forEach(k=>{
    const pid = k.split('|')[0], nk = pid+'|'+newDay+'|'+newSlot;
    if(nk!==k && st.overrides[nk] && st.overrides[nk].stationId!==sid) blocked.push(pid);
  });
  if(blocked.length || dryRun) return blocked;
  keys.forEach(k=>{ const pid = k.split('|')[0]; delete st.overrides[k]; st.overrides[pid+'|'+newDay+'|'+newSlot] = { type:'station', stationId:sid }; });
  s.sessDayId = newDay; s.sessSlotId = newSlot; s.activeDayIds = [newDay];
  if(s.scanDayId){ s.scanDayId = newDay; s.scanSlotId = newSlot; }
  return [];
}
function renderSessions(){
  const sessions = state.stations.filter(s=>s.type==='session' && !s.partnerSessionId);
  const dayIdx = id=>{ const i = state.days.findIndex(d=>d.id===id); return i<0 ? 99 : i; };
  const slotStart = (dId, slId)=>{ const d = getDay(dId), sl = d && d.slots.find(x=>x.id===slId); return sl ? startMinutes(sl.start) : 9999; };

  bodyEl.innerHTML = `
    <div class="panel">
      <div class="flex-between" style="margin-bottom:6px">
        <h2 style="margin-bottom:0">Sessions <span class="pill" id="sess-count"></span></h2>
        <button class="btn sm ghost" id="sess-add">+ Add session</button>
      </div>
      <div class="muted" style="margin-bottom:8px">Edit any session here — changes save to the shared board immediately. Changing the day or time moves its presenters with it. Type a name in "Add presenter" and pick from the list. "Scan?" controls whether the session appears on the Scanning tab.</div>
      <div class="row" style="margin-bottom:8px">
        <div class="day-tabs" id="sess-days"></div>
        <input type="text" id="sess-search" placeholder="Search title, room, or presenter…" style="width:280px" value="${esc(sessionsQuery)}">
      </div>
      <datalist id="sess-staff-list">${[...state.staff].sort(byFirstName).map(p=>`<option value="${esc(p.name)}"></option>`).join('')}</datalist>
      <div class="scrollx scrolly" style="max-height:70vh">
        <table><thead><tr><th>Day</th><th>Time slot</th><th>Title</th><th>Room</th><th>Presenters</th><th>Scan?</th><th></th></tr></thead>
        <tbody id="sess-rows"></tbody></table>
      </div>
    </div>`;

  const dt = document.getElementById('sess-days');
  dt.innerHTML = [{id:'all',name:'All'}, ...state.days.filter(d=>sessions.some(s=>sessionDaySlot(s).dayId===d.id))]
    .map(d=>`<button class="btn sm ${sessionsDayFilter===d.id?'active':'ghost'}" data-sday="${d.id}">${esc(d.name)}</button>`).join('');
  dt.querySelectorAll('button').forEach(b=>b.onclick=()=>{ sessionsDayFilter = b.dataset.sday; render(); });

  function drawRows(){
    const q = sessionsQuery.trim().toLowerCase();
    const rows = sessions.filter(s=>{
      const ds = sessionDaySlot(s);
      if(sessionsDayFilter!=='all' && ds.dayId!==sessionsDayFilter) return false;
      if(!q) return true;
      const names = getSessionPresenterIds(s.id).map(id=>{ const p = getStaff(id); return p ? p.name : ''; }).join(' ');
      return (s.name+' '+(s.room||'')+' '+names).toLowerCase().includes(q);
    }).sort((a,b)=>{
      const da = sessionDaySlot(a), db = sessionDaySlot(b);
      return dayIdx(da.dayId)-dayIdx(db.dayId) || slotStart(da.dayId,da.slotId)-slotStart(db.dayId,db.slotId) || a.name.localeCompare(b.name);
    });
    document.getElementById('sess-count').textContent = rows.length+' of '+sessions.length;
    document.getElementById('sess-rows').innerHTML = rows.map(s=>{
      const ds = sessionDaySlot(s);
      const pres = getSessionPresenterIds(s.id).map(id=>getStaff(id)).filter(Boolean).sort(byFirstName);
      return `<tr>
        <td><select data-sf="day" data-sid="${s.id}">${state.days.map(d=>`<option value="${d.id}" ${ds.dayId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></td>
        <td><select data-sf="slot" data-sid="${s.id}">
          ${ds.slotId ? '' : '<option value="">— choose —</option>'}
          ${sessionSlotChoices(ds.dayId).map(sl=>`<option value="${sl.id}" ${ds.slotId===sl.id?'selected':''}>${esc(sl.label)}</option>`).join('')}
        </select></td>
        <td><input type="text" data-sf="name" data-sid="${s.id}" value="${esc(s.name)}" style="width:340px"></td>
        <td><input type="text" data-sf="room" data-sid="${s.id}" value="${esc(s.room||'')}" style="width:110px"></td>
        <td style="min-width:260px">
          ${pres.map(p=>`<span class="pill" style="margin:0 4px 4px 0">${esc(p.name)} <a href="#" data-srem="${s.id}|${p.id}" title="Remove" style="text-decoration:none;margin-left:4px">×</a></span>`).join('')}
          <input type="text" list="sess-staff-list" data-sadd="${s.id}" placeholder="Add presenter…" style="width:150px">
        </td>
        <td style="text-align:center"><input type="checkbox" data-sf="scan" data-sid="${s.id}" ${s.scanDayId?'checked':''}></td>
        <td><button class="btn sm ghost" data-sdel="${s.id}">Remove</button></td>
      </tr>`;
    }).join('') || '<tr><td colspan="7" class="muted">No sessions match.</td></tr>';
    bindRows();
  }

  function bindRows(){
    const root = document.getElementById('sess-rows');
    root.querySelectorAll('[data-sf]').forEach(el=>{
      el.onchange = ()=>{
        const sid = el.dataset.sid, f = el.dataset.sf;
        const s = state.stations.find(x=>x.id===sid);
        if(!s) return;
        if(f==='name' || f==='room'){ update(st=>{ const x = st.stations.find(y=>y.id===sid); x[f] = el.value; }); return; }
        if(f==='scan'){
          update(st=>{
            const x = st.stations.find(y=>y.id===sid), ds = sessionDaySlot(x);
            if(el.checked && ds.dayId && ds.slotId){ x.scanDayId = ds.dayId; x.scanSlotId = ds.slotId; }
            else { delete x.scanDayId; delete x.scanSlotId; if(st.scanAssignments) delete st.scanAssignments[sid]; }
          });
          return;
        }
        // day or slot change
        const cur = sessionDaySlot(s);
        let nd = cur.dayId, ns = cur.slotId;
        if(f==='day'){ nd = el.value; const ch = sessionSlotChoices(nd); ns = ch.length ? ch[0].id : ''; }
        else ns = el.value;
        if(!nd || !ns){ render(); return; }
        const blocked = moveSessionTo(state, sid, nd, ns, true);
        if(blocked.length){
          const names = blocked.map(id=>{ const p = getStaff(id); return p ? p.name : id; }).join(', ');
          customAlert('Can\'t move this session there \u2014 already booked at that time: '+names+'. Remove them from that other assignment (or from this session) first.', 'Scheduling conflict');
          render(); return;
        }
        update(st=>{ moveSessionTo(st, sid, nd, ns); });
      };
    });
    root.querySelectorAll('[data-srem]').forEach(a=>{
      a.onclick = (e)=>{
        e.preventDefault();
        const [sid, pid] = a.dataset.srem.split('|');
        update(st=>{ Object.keys(st.overrides).forEach(k=>{ const v = st.overrides[k]; if(k.split('|')[0]===pid && v && v.stationId===sid) delete st.overrides[k]; }); });
      };
    });
    root.querySelectorAll('[data-sadd]').forEach(inp=>{
      inp.onchange = ()=>{
        const name = inp.value.trim(); if(!name) return;
        const sid = inp.dataset.sadd;
        const s = state.stations.find(x=>x.id===sid), ds = sessionDaySlot(s);
        const p = state.staff.find(x=>x.name.toLowerCase()===name.toLowerCase());
        if(!p){ customAlert('No one on the roster is named "'+name+'". Pick a name from the list.', 'Not found'); inp.value=''; return; }
        if(!ds.dayId || !ds.slotId){ customAlert('Choose a day and time slot for this session first.', 'No time set'); inp.value=''; return; }
        const key = p.id+'|'+ds.dayId+'|'+ds.slotId;
        const existing = state.overrides[key];
        if(existing && existing.stationId!==sid){
          const other = existing.stationId ? getStation(existing.stationId) : null;
          customAlert(p.name+' is already assigned at that time'+(other ? ' ('+other.name+')' : '')+'. Remove that assignment first.', 'Scheduling conflict');
          inp.value=''; return;
        }
        update(st=>{ st.overrides[key] = { type:'station', stationId:sid }; });
      };
    });
    root.querySelectorAll('[data-sdel]').forEach(b=>{
      b.onclick = ()=>{
        const sid = b.dataset.sdel, s = state.stations.find(x=>x.id===sid);
        customConfirm('Remove "'+(s?s.name:'this session')+'" and unassign its presenters and scanner? This can\'t be undone.', (ok)=>{
          if(!ok) return;
          update(st=>{
            st.stations = st.stations.filter(x=>x.id!==sid);
            Object.keys(st.overrides).forEach(k=>{ const v = st.overrides[k]; if(v && v.stationId===sid) delete st.overrides[k]; });
            if(st.scanAssignments) delete st.scanAssignments[sid];
          });
        }, 'Remove session');
      };
    });
  }

  document.getElementById('sess-search').oninput = (e)=>{ sessionsQuery = e.target.value; drawRows(); };
  document.getElementById('sess-add').onclick = ()=>update(st=>{
    const dayId = (sessionsDayFilter!=='all' && getDay(sessionsDayFilter)) ? sessionsDayFilter : 'mon';
    const ch = sessionSlotChoices(dayId);
    const slotId = ch.length ? ch[0].id : '';
    st.stations.push({ id:uid('sesst'), name:'New session', type:'session', activeDayIds:[dayId], required:2, room:'', sessDayId:dayId, sessSlotId:slotId, scanDayId:dayId, scanSlotId:slotId });
    sessionsQuery = '';
  });
  drawRows();
}

// ---------- POD READINESS TAB ----------
function getPodReadiness(stationId){
  if(!state.podReadiness) state.podReadiness = {};
  return state.podReadiness[stationId] || { status:'in_process', notes:'' };
}
function getProductReadiness(key){
  if(!state.productReadiness) state.productReadiness = {};
  return state.productReadiness[key] || { sso:'', insights:'', askAgora:'', agoraWidget:'', note:'' };
}
function classifyReadiness(v){
  if(!v || !v.trim()) return 'unknown';
  const s = v.trim().toLowerCase();
  if(s.startsWith('n/a')) return 'na';
  if(s.startsWith('yes')) return 'yes';
  if(s.startsWith('no')) return 'no';
  return 'partial';
}
function getPodProducts(stationId){
  if(!state.podProductList) state.podProductList = {};
  if(!state.podProductList[stationId]) state.podProductList[stationId] = [];
  return state.podProductList[stationId];
}
async function exportReadinessXLSX(){
  if(window.__mriLibsReady) await window.__mriLibsReady;
  if(!window.XLSX){ customAlert('Excel library did not load — check your connection and try again.'); return; }
  const pods = state.stations.filter(s=>s.type==='pod').sort((a,b)=>a.podNumber-b.podNumber);

  const detailHeader = ['Pod #','Pod Name','Zone','Pod Status','At-Risk Notes','Product','SSO','Agora Insights','Ask Agora','Agora Widget Ready','Note'];
  const detailRows = [detailHeader];
  pods.forEach(pod=>{
    const r = getPodReadiness(pod.id);
    const statusLabel = r.status==='complete' ? 'Complete' : 'In Process';
    const items = getPodProducts(pod.id);
    if(!items.length){
      detailRows.push([pod.podNumber, pod.name, pod.zone||'', statusLabel, r.notes||'', '', '', '', '', '', '']);
      return;
    }
    items.forEach(item=>{
      const dataKey = item.key || item.display;
      const p = getProductReadiness(dataKey);
      detailRows.push([pod.podNumber, pod.name, pod.zone||'', statusLabel, r.notes||'', item.display, p.sso||'', p.insights||'', p.askAgora||'', p.agoraWidget||'', p.note||'']);
    });
  });

  // Dashboard summary sheet
  const allKeys = new Set();
  pods.forEach(pod=> getPodProducts(pod.id).forEach(it=>allKeys.add(it.key || it.display)));
  const fields = ['sso','insights','askAgora','agoraWidget'];
  const fieldLabels = {sso:'SSO', insights:'Agora Insights', askAgora:'Ask Agora', agoraWidget:'Agora Widget Ready'};
  const kpi = {};
  fields.forEach(f=> kpi[f] = {yes:0,no:0,partial:0,na:0,unknown:0});
  allKeys.forEach(key=>{
    const p = getProductReadiness(key);
    fields.forEach(f=> kpi[f][classifyReadiness(p[f])]++);
  });
  const completeCount = pods.filter(p=>getPodReadiness(p.id).status==='complete').length;
  const atRiskCount = pods.filter(p=>(getPodReadiness(p.id).notes||'').trim()).length;
  const summaryRows = [
    ['Ascend Pod Readiness \u2014 Summary'],
    [],
    ['Pods complete', completeCount, 'of', pods.length],
    ['Pods in process', pods.length-completeCount],
    ['Pods with at-risk notes', atRiskCount],
    ['Products tracked', allKeys.size],
    [],
    ['Field','Yes','Partial','No','N/A','Unknown'],
  ];
  fields.forEach(f=> summaryRows.push([fieldLabels[f], kpi[f].yes, kpi[f].partial, kpi[f].no, kpi[f].na, kpi[f].unknown]));

  const wb = XLSX.utils.book_new();
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:22},{wch:10},{wch:6},{wch:10},{wch:8},{wch:10}];
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

  const wsDetail = XLSX.utils.aoa_to_sheet(detailRows);
  wsDetail['!cols'] = [{wch:6},{wch:26},{wch:16},{wch:12},{wch:26},{wch:30},{wch:24},{wch:24},{wch:24},{wch:20},{wch:30}];
  XLSX.utils.book_append_sheet(wb, wsDetail, 'Pod Readiness Detail');

  XLSX.writeFile(wb, 'ascend_pod_readiness.xlsx');
}
function renderReadiness(){
  const pods = state.stations.filter(s=>s.type==='pod').sort((a,b)=>a.podNumber-b.podNumber);
  const completeCount = pods.filter(p=>getPodReadiness(p.id).status==='complete').length;
  const atRiskCount = pods.filter(p=>(getPodReadiness(p.id).notes||'').trim()).length;

  // unique product data-keys actually shown across all pods, for KPI counts (avoid double-counting shared products)
  const allKeys = new Set();
  pods.forEach(pod=> getPodProducts(pod.id).forEach(it=>allKeys.add(it.key || it.display)));
  const kpi = { sso:{yes:0,no:0,partial:0,na:0,unknown:0}, insights:{yes:0,no:0,partial:0,na:0,unknown:0}, askAgora:{yes:0,no:0,partial:0,na:0,unknown:0}, agoraWidget:{yes:0,no:0,partial:0,na:0,unknown:0} };
  allKeys.forEach(key=>{
    const p = getProductReadiness(key);
    kpi.sso[classifyReadiness(p.sso)]++;
    kpi.insights[classifyReadiness(p.insights)]++;

          <div style="width:${pct(counts.yes)}%;background:#8FCB8F" title="Yes: ${counts.yes}"></div>
          <div style="width:${pct(counts.partial)}%;background:${CATEGORY_COLORS.session}" title="Partial: ${counts.partial}"></div>
          <div style="width:${pct(counts.no)}%;background:#E08787" title="No: ${counts.no}"></div>
          <div style="width:${pct(counts.na+counts.unknown)}%;background:#D8D2C2" title="N/A or unknown: ${counts.na+counts.unknown}"></div>
        </div>
      </div>`;
  }

  bodyEl.innerHTML = `
    <div class="note">Demo pod readiness for Ascend — what's demoed at each pod, its SSO / Agora Insights / Ask Agora / Agora Widget Ready status, plus a status and at-risk notes. All fields are editable here and save with the rest of the board.</div>
    <div class="panel" style="margin-bottom:14px">
      <div class="flex-between">

      <div style="display:flex;gap:20px;flex-wrap:wrap">

  document.getElementById('readiness-export-xlsx').onclick = exportReadinessXLSX;

    inp.onchange = ()=>update(st=>{
      const key = inp.dataset.key, field = inp.dataset.rf;
      if(!st.productReadiness) st.productReadiness = {};
      if(!st.productReadiness[key]) st.productReadiness[key] = {sso:'', insights:'', askAgora:'', agoraWidget:'', note:''};
      st.productReadiness[key][field] = inp.value;
    });
  });
}

function pad(n){ return String(n).padStart(2,'0'); }
function toICSDate(dateStr, timeStr){
  // dateStr YYYY-MM-DD, timeStr HH:MM local (event is in Las Vegas; late Oct is still Pacific Daylight Time, UTC-7)
  if(!timeStr) return null;
  const [y,mo,da] = dateStr.split('-').map(Number);
  const [h,m] = timeStr.split(':').map(Number);
  // build as UTC by adding the 7-hour PDT offset, so output is unambiguous (no floating time)
  const utcMs = Date.UTC(y, mo-1, da, h+7, m, 0);
  const dt = new Date(utcMs);
  return dt.getUTCFullYear()+pad(dt.getUTCMonth()+1)+pad(dt.getUTCDate())+'T'+pad(dt.getUTCHours())+pad(dt.getUTCMinutes())+'00Z';
}
function icsNow(){
  const d = new Date();
  return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
}
function downloadICS(person){
  let lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ascend Staffing Board//EN','CALSCALE:GREGORIAN'];
  getScheduleRows(person.id, false).forEach(r=>{
    const day = getDay(r.dayId);
    const dtStart = toICSDate(day.date, r.start);
    const dtEnd = toICSDate(day.date, r.end);
    if(!dtStart || !dtEnd) return;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+uid('evt')+'@ascend');
    lines.push('DTSTAMP:'+icsNow());
    lines.push('DTSTART:'+dtStart);
    lines.push('DTEND:'+dtEnd);
    lines.push('SUMMARY:'+r.text);
    lines.push('DESCRIPTION:'+r.slotLabel);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob = new Blob([lines.join('\r\n')], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = person.name.replace(/[^a-z0-9]+/gi,'_') + '_schedule.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadPDF(person){
  if(window.__mriLibsReady) await window.__mriLibsReady;
  if(!window.jspdf){ customAlert('PDF library did not load — check your connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'letter' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 48;
  let y = 56;

  function ensureRoom(lineH){
    if(y + lineH > pageH - 48){
      doc.addPage();
      y = 56;
    }
  }

  // header
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(4,77,102);
  doc.text('Ascend Staffing Board', marginX, y); y += 22;
  doc.setFontSize(14); doc.setTextColor(20,20,20);
  doc.text(person.name, marginX, y); y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(90,90,90);
  const sub = [person.dept, person.notes].filter(Boolean).join(' · ');
  if(sub){ doc.text(sub, marginX, y); y += 14; }
  y += 6;
  doc.setDrawColor(200,200,200); doc.line(marginX, y, pageW-marginX, y); y += 18;

  const contentW = pageW - marginX*2;

  const allRows = getScheduleRows(person.id, false);
  state.days.forEach(d=>{
    const rows = allRows.filter(r=>r.dayId===d.id);
    if(!rows.length) return;
    ensureRoom(26);
    doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(4,77,102);
    doc.text(d.name, marginX, y); y += 16;
    doc.setDrawColor(230,230,230); doc.line(marginX, y-10, pageW-marginX, y-10);

    rows.forEach(r=>{
      const timeWrapped = doc.splitTextToSize(r.slotLabel, contentW);
      const labelWrapped = doc.splitTextToSize(r.text, contentW - 14);
      const lineH = 12*timeWrapped.length + 13*labelWrapped.length + 10;
      ensureRoom(lineH);
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      if(r.isScan){ doc.setTextColor(184,108,16); } else { doc.setTextColor(120,120,120); }
      doc.text(timeWrapped, marginX, y);
      y += 12*timeWrapped.length + 2;
      doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(25,25,25);
      if(r.color && /^#[0-9a-f]{6}$/i.test(r.color)){
        const rr=parseInt(r.color.slice(1,3),16), gg=parseInt(r.color.slice(3,5),16), bb=parseInt(r.color.slice(5,7),16);
        doc.setFillColor(rr,gg,bb);
        doc.rect(marginX+8, y-10, contentW-8, 13*labelWrapped.length+3, 'F');
      }
      doc.text(labelWrapped, marginX+14, y);
      y += 13*labelWrapped.length + 8;
    });
    y += 8;
  });

  doc.save(person.name.replace(/[^a-z0-9]+/gi,'_') + '_schedule.pdf');
}

function csvEscape(v){ v = String(v===undefined||v===null?'':v); if(/[",\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  // Excel assumes Windows-1252 unless told otherwise, which mangles en-dashes
  // and other non-ASCII characters (shows up as "â€"" etc). A UTF-8 BOM fixes it.
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportMasterCSV(){
  const header = ['Name','Department','Home Station 1','Home Station 2','Scanner?'];
  state.days.forEach(d=> d.slots.forEach(s=> header.push(d.name+' · '+s.label)));
  const rows = [header];
  state.staff.forEach(p=>{
    const home = getStation(p.homeStationId);
    const home2 = getStation(p.homeStationId2);
    const row = [p.name, p.dept||'', home?home.name:'', home2?home2.name:'', p.canScan?'Yes':''];
    state.days.forEach(d=> d.slots.forEach(s=>{
      const a = computeAssignment(p.id,d.id,s.id);
      let label = assignmentLabel(a);
      if(a.type==='station'){ const st=getStation(a.stationId); if(st && st.type==='session' && st.room) label += ' - '+st.room; }
      row.push(label);
    }));
    rows.push(row);
  });
  downloadCSV('ascend_master_schedule.csv', rows);
}
function exportCoverageCSV(){
  const rows = [['Day','Station','Time Slot','Assigned','Required']];
  state.days.forEach(d=>{
    const stations = stationsActiveOnDay(d.id);
    d.slots.filter(s=>s.type==='coverage').forEach(s=>{
      stations.forEach(st2=>{
        const count = state.staff.filter(p=>{
          const a = computeAssignment(p.id,d.id,s.id);
          return a.type==='station' && a.stationId===st2.id;
        }).length;
        rows.push([d.name, st2.name, s.label, count, st2.required]);
      });
    });
  });
  downloadCSV('ascend_coverage_summary.csv', rows);
}
